name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck and test (TypeScript)
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "true"
      # Prisma only needs a well-formed URL to generate the client; nothing connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @repo/database build
      - run: pnpm typecheck
      - run: pnpm test

  database:
    name: Migrations and import tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: takumo
          POSTGRES_PASSWORD: takumo
          POSTGRES_DB: takumo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U takumo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: postgresql://takumo:takumo@localhost:5432/takumo
      TEST_DATABASE_URL: postgresql://takumo:takumo@localhost:5432/takumo
      TEST_ASK_DATABASE_URL: postgresql://takumo_reader:ci-reader@localhost:5432/takumo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @repo/database build
      # The first migration uses the vector type, so the extension comes first
      # (on Supabase: Database → Extensions → vector).
      - name: Enable pgvector
        working-directory: packages/database
        run: echo "create extension if not exists vector;" | pnpm exec prisma db execute --stdin
      - name: Apply migrations to an empty database
        run: pnpm migrate:deploy
      - name: Import tests against the database
        working-directory: packages/ingest
        run: pnpm test:db
      # Ask Takumo's read-only login (set per environment, see docs/DEPLOY.md).
      - name: Give the reader a password
        working-directory: packages/database
        run: echo "alter role takumo_reader password 'ci-reader';" | pnpm exec prisma db execute --stdin
      - name: Ask Takumo reader isolation tests
        working-directory: packages/database
        run: pnpm test:db

  engine:
    name: Test scheduling engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  engine-image:
    name: Build engine Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f services/engine/Dockerfile -t takumo-engine .
      - name: Start and check /health
        run: |
          docker run -d --name engine -p 8000:8000 -e ENGINE_SECRET=ci takumo-engine
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/health && exit 0
            sleep 1
          done
          docker logs engine
          exit 1
