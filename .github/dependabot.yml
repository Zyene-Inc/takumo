version: 2
updates:

  # GitHub Actions used by CI: one grouped PR a month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  # npm: the root covers every package in the pnpm workspace, so each update
  # arrives once instead of once per app/package.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # Safe updates in one PR.
      minor-and-patch:
        update-types: ["minor", "patch"]
      # Breaking updates in one PR, to review together.
      major:
        update-types: ["major"]
    ignore:
      # TypeScript 7 (native compiler) isn't supported by Next.js and Prisma yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep Node types on the Node major we run (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Python scheduling engine.
  - package-ecosystem: "uv"
    directory: "/services/engine"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
