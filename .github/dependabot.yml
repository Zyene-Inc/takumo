version: 2
updates:

  # GitHub Actions used by CI: one grouped PR a month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  # npm: the root covers every package in the pnpm workspace, so each update
  # arrives once instead of once per app/package.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 8
    groups:
      # Safe updates in one PR.
      minor-and-patch:
        update-types: ["minor", "patch"]
      # Major (breaking) updates are not grouped: each library gets its own
      # PR, so one break doesn't hold back the rest and a regression points
      # at one library.
    ignore:
      # TypeScript 7 (native compiler) isn't supported by Next.js and Prisma yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep Node types on the Node major we run (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Python scheduling engine.
  - package-ecosystem: "uv"
    directory: "/services/engine"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Inbound mail receiver (standalone npm package, outside the pnpm workspace).
  - package-ecosystem: "npm"
    directory: "/services/mail"
    schedule:
      interval: "monthly"
    groups:
      mail:
        patterns: ["*"]
        # Majors come one per PR (see the npm entry above).
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
