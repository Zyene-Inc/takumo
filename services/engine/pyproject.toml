[project]
name = "takumo-engine"
version = "0.1.0"
description = "Takumo engines: scheduling, capacity checks and (later) quoting and simulation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "ortools>=9.11",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
