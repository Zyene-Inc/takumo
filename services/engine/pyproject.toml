[project]
name = "takumo-engine"
version = "0.1.0"
description = "Takumo engines: scheduling, capacity checks and (later) quoting and simulation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "ortools>=9.11",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify.
select = ["E", "F", "I", "B", "UP", "SIM"]
# Long lines are the formatter's job; strings and comments may run over.
ignore = ["E501"]
